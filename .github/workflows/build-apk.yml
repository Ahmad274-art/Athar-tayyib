name: Build Athar Tayyib APK

on:
  workflow_dispatch:
  push:
    paths:
      - "athar-tayyib-capacitor.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -q athar-tayyib-capacitor.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v"; missing=1; fi
          done
          exit $missing

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/athar-release.keystore"

      - name: Install dependencies
        working-directory: athar-tayyib-capacitor
        run: npm install

      - name: Create Android project
        working-directory: athar-tayyib-capacitor
        run: npx cap add android

      - name: Generate app icons
        working-directory: athar-tayyib-capacitor
        run: npx capacitor-assets generate --android

      - name: Prepare Android app (version + signing)
        working-directory: athar-tayyib-capacitor
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/athar-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: node scripts/prepare-android.mjs

      - name: Sync app files
        working-directory: athar-tayyib-capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: athar-tayyib-capacitor
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/athar-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athar-tayyib-apk
          path: athar-tayyib-capacitor/android/app/build/outputs/apk/release/*.apk
